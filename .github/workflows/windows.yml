name: Windows app
# Builds the Windows installer (unsigned).
#
# On a pull request (or a manual run) the .exe is kept as a download on the run for 14 days. Auto release calls this
# workflow with the release's tag after each release, and then the installer is built from that tag and attached to the
# GitHub release. The version inside comes from scripts/app-version.sh.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) to build and attach the installer to.
        type: string
        required: true
jobs:
  build:
    name: Build LED Monitor installer
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and package
        run: scripts/build.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: LED Monitor (Windows)
          path: packages/launcher/release/*.exe
          retention-days: 14
      - name: Attach to the release
        if: inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          exe="$(ls -t packages/launcher/release/*.exe | head -n1)"
          named="packages/launcher/release/LED-Monitor-$TAG-windows-setup.exe"
          [ "$exe" = "$named" ] || cp "$exe" "$named"
          gh release upload "$TAG" "$named" --clobber --repo "$GITHUB_REPOSITORY"
